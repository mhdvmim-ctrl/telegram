services:
  - type: web
    name: mhdv-telegram-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: /var/data/mhdv_bot.db
      - key: WEB_PANEL_PASSWORD
        sync: false
    disks:
      - name: mhdv-data
        mountPath: /var/data
        sizeGB: 1